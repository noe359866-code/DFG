# Despliegue en Cloudflare Workers. Los secretos NO van aquí: se configuran
# con `npx wrangler secret put SUPABASE_URL` (y SUPABASE_ANON_KEY /
# SUPABASE_SERVICE_ROLE_KEY) o en `.dev.vars` para `wrangler dev` local.
#
# `name` DEBE coincidir con el Worker que existe en el panel de Cloudflare
# (Workers & Pages → nexo-player-app). Workers Builds comprueba esta
# coincidencia en cada deploy y, con `npm run deploy` manual, un nombre
# distinto crearía un segundo Worker en lugar de actualizar el que está en
# producción.
name = "nexo-player-app"
main = "worker.mjs"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat"]

# Smart placement queda desactivado a propósito: el trabajo predomina en
# contenido cacheado (manifiesto y streams) con una sola consulta saliente;
# colocarse junto a Supabase solo añadiría ida y vuelta al visitante.

# Bloque exigido por `npx wrangler preview` (comando en beta que usa
# Cloudflare Builds para las compilaciones de rama/PR). Puede ir vacío: los
# assets y las opciones de compatibilidad siguen arriba y los Preview no
# heredan vars ni bindings del nivel superior, así que aquí no hay secretos.
[previews]

# Los estáticos de public/ se sirven desde el edge sin invocar el Worker y
# respaldan sus cabeceras con public/_headers.
[assets]
directory = "./public"
binding = "ASSETS"

# Registros en el panel de Cloudflare y en `npm run tail`.
[observability]
enabled = true
